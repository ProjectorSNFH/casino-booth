</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
(()=>{const c=$('#bg'),x=c.getContext('2d'),S=22,rs=()=>{c.width=innerWidth;c.height=innerHeight};rs();addEventListener('resize',rs);
const f=t=>{const h=c.height,pf=(t/5200)%1.5;x.clearRect(0,0,c.width,h);for(let y=S/2;y<h;y+=S)for(let u=S/2;u<c.width;u+=S){const d=1-y/h+Math.sin(u/70+t/1100)*.025,k=Math.max(0,1-Math.abs(d-pf)*4.5);x.fillStyle=`rgba(255,255,255,${.07+.5*k})`;x.beginPath();x.arc(u,y,1+1.3*k,0,6.3);x.fill()}requestAnimationFrame(f)};requestAnimationFrame(f)})();
addEventListener('pointerdown',e=>{const t=e.target.closest('.rp,.btn');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.5,i=document.createElement('i');i.className='rip';i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(i);setTimeout(()=>i.remove(),650)});
function mk(id,ic,t,d,btn){const s=document.createElement('section');s.className='s';s.id=id;s.innerHTML=`<div class="mid"><div class="nz"><div class="gl c center"><div class="ic">${ic}</div><h1>${t}</h1><p>${d}</p>${btn||''}</div></div></div>`;$('.app').appendChild(s)}
function go(n){$$('.s').forEach(e=>e.classList.toggle('on',e.id===n));$$('#dv button').forEach(b=>b.classList.toggle('on',b.dataset.n===n));window.hook&&hook(n)}
function dev(o){for(const k in o){const e=document.createElement('button');e.textContent=o[k];e.dataset.n=k;e.onclick=()=>window.demo&&demo[k]?demo[k]():go(k);$('#dv').appendChild(e)}}
function keypad(el,left,k,d,l){el.className='kp';[1,2,3,4,5,6,7,8,9,'L',0,'D'].forEach(v=>{const b=document.createElement('button');b.className='k rp';b.textContent=v==='L'?left:v==='D'?'⌫':v;if(v==='L'&&!left)b.style.visibility='hidden';b.onclick=()=>v==='D'?d():v==='L'?l():k(String(v));el.appendChild(b)})}

const API=CasinoAPI,GN={HALLIGALLI:'할리갈리',CHAMCHAMCHAM:'참참참',JOKER:'조커 뽑기',RANDOMBALL:'랜덤 공',TABLESOCCER:'테이블 축구',SKEWER:'꼬치의 달인'},gname=g=>GN[g]||'게임';
const pad=n=>String(n).padStart(3,'0'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EM={'마이쥬':'🍬','마카로니':'🍝','초코파이':'🍫','쌀과자':'🍘','젤리스트로우':'🍭'};
mk('err','🌐','오류가 발생했습니다','연결 지연 또는 연결하는 중에 오류가 발생하였습니다.','<button class="btn" onclick="location.reload()">↻ 새로고침</button>');
let errOn=false,S=null,cur='home',bet='0',coins=0,cart={},prods=null,seq=0,fails=0,busy=0,baseLast,doneT=null,shopT=null,qrUid='',pollT=null;
const MATCHY=['bet','wait','match','result'];
function toast(m,ms){const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',ms||2400)}
const cv=()=>$$('.cv').forEach(e=>e.textContent=coins),rbet=()=>$('#ba').textContent=bet;
/* 화면 이동: err는 덮어쓰기 화면이라 cur를 바꾸지 않는다. 인라인 버튼의 go()도 cur를 따라가게 감싼다 */
const baseGo=go;go=function(n){if(n!=='err')cur=n;baseGo(n)};const show=n=>go(n);
const CAP=['bet','wait','match','result','done','warn','shop','order'];
window.hook=n=>{$('#cap').classList.toggle('on',CAP.includes(n));$('#cap').style.bottom=n==='shop'?'86px':'14px';$('#ft').style.display=n==='shop'?'block':'none';
 clearInterval(shopT);if(n==='shop'){cart={};loadProds();shopT=setInterval(()=>{if(!document.hidden)loadProds()},5000)}cv()};
keypad($('#kp'),'전액',d=>{bet=bet==='0'?d:bet+d;if(+bet>coins)bet=String(coins);rbet()},()=>{bet=bet.length>1?bet.slice(0,-1):'0';rbet()},()=>{bet=String(coins);rbet()});
function renderQR(uid){if(!uid||uid===qrUid)return;qrUid=uid;const q=qrcode(0,'M');q.addData(uid,'Alphanumeric');q.make();$('#qr').innerHTML=q.createSvgTag({cellSize:4,scalable:true});$('#uidt').innerHTML=uid.match(/.{4}/g).join('<br>')}
function fail(e){console.error(e);const k=e&&e.code;if(k==='UNAUTHORIZED'||k==='STALE_TOKEN')return;if(e&&e.status>=400&&e.status<500){toast(e.message||'처리할 수 없어요');return refresh().catch(()=>{})}toast('연결이 불안해요. 잠시 후 다시 눌러주세요',3500)}
async function run(f){if(busy)return;busy++;try{await f()}catch(e){fail(e)}finally{busy--}}
/* 서버 상태 → 화면 */
function target(s){const m=s.match,o=s.order;
 if(m)return m.phase==='prep'?(m.stage==='scanned'?'bet':'wait'):m.phase==='review'?'result':'match';
 if(o&&o.status==='pending')return 'order';
 if(MATCHY.includes(cur))return s.last&&s.last.id!==baseLast?'done':'home';
 if(cur==='order')return 'home';
 return cur}
function apply(s){const c=s.card;
 if(!c){API.logout('me');return location.replace('/')}
 if(c.status==='banned')return location.replace('/blocked.html#banned');
 if(c.status==='done')return location.replace('/blocked.html#'+(s.exit_reason==='part_end'?'expired':'exited'));
 if(c.status!=='active'){API.logout('me');return location.replace('/')}
 const prev=S;S=s;coins=s.balance;$('.idb b').textContent=pad(c.id);renderQR(c.uid);
 if(baseLast===undefined)baseLast=s.last?s.last.id:0;
 if(errOn){errOn=false;go(cur)}
 const m=s.match,t=target(s),was=cur;
 $('#ordb').hidden=s.plays<s.shop_min_plays;const oh=$('#ordh');oh.hidden=s.plays>=s.shop_min_plays;oh.textContent=`상품 주문은 게임을 ${s.shop_min_plays}회 이상 참여하면 할 수 있어요 (현재 ${s.plays}회)`;
 if(t!==was){
  if(t==='bet'){bet='0';rbet()}
  if(m&&(was==='warn'||was==='shop')){cart={};$('#ov').classList.remove('on');toast('게임에 참여하게 되어 상점을 닫았어요')}
  if(t==='done'){baseLast=s.last.id;const d=s.last.delta;$('#dt').textContent=(d>0?'+'+d:d<0?'−'+Math.abs(d):'변동 없음')+(d?' 코인 · ':' · ')+'곧 홈으로 돌아갑니다';clearTimeout(doneT);doneT=setTimeout(()=>{if(cur==='done')show('home')},2900)}
  else if(t==='home'&&MATCHY.includes(was))toast('게임 참여가 종료되었어요');
  else if(t==='home'&&was==='order'&&s.order&&s.order.status==='rejected')toast('주문이 거절되었어요');
  show(t)}

 if(m){const n=gname(m.game),nb=m.stage!=='scanned'&&m.bet===0;
  $('#bg1').textContent=n+' · 베팅 금액';$('#mg').textContent=n;$('#mb').textContent=nb?'진행 중':m.bet;
  if(m.phase==='prep'&&m.stage!=='scanned'){const ready=m.stage==='ready';$('#wt').textContent=ready?'게임 시작 대기':'스태프 승인 대기';
   $('#wp').innerHTML=esc(n)+(nb?' · 베팅 없는 게임':' · 베팅 '+esc(m.bet)+'코인')+'<br>'+(ready?'승인되었어요. 게임이 시작될 때까지 기다려주세요.':'스태프가 확인하면 게임이 시작됩니다.')}
  if(m.phase==='review'){const d=m.proposed_delta;$('#ri').textContent=d>0?'🏆':d<0?'😢':'🤝';$('#rt').textContent=d>0?'승리 +'+d:d<0?'패배 −'+Math.abs(d):'변동 없음';
   $('#rp').textContent=m.acked?'확인했어요. 스태프가 정산하면 홈으로 돌아갑니다.':'정산에 반영될 결과입니다. 확인만 눌러주세요.';const rb=$('#rb');rb.disabled=!!m.acked;rb.textContent=m.acked?'확인 완료':'확인'}}
 cv();if(cur==='shop')rshop()}
async function refresh(){const my=++seq;const s=await API.me.state();if(my!==seq)return;fails=0;apply(s)}
async function poll(){clearTimeout(pollT);if(!document.hidden&&!busy){try{await refresh()}catch(e){const k=e&&e.code;if(k!=='UNAUTHORIZED'&&k!=='STALE_TOKEN'){console.error(e);if(++fails>=3){errOn=true;go('err')}}}}pollT=setTimeout(poll,2500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
API.onSessionLost((kind,code)=>{if(kind!=='me')return;location.replace(code==='STALE_TOKEN'?'/blocked.html#kicked':'/')});
/* 베팅 */
const setBet=()=>{if(+bet<1)return;run(async()=>{await API.me.bet({bet:+bet});if(S&&S.match){S.match.stage='bet_set';S.match.bet=+bet}await refresh()})};
const leave=()=>run(async()=>{await API.me.leave();await refresh()});
const ack=()=>run(async()=>{await API.me.ack();await refresh()});
/* 상점 */
const P=()=>prods||[],tot=()=>P().reduce((s,p)=>s+p.price*(cart[p.id]||0),0);
async function loadProds(){try{const r=await API.me.products();prods=r.products||[];rshop()}catch(e){console.error(e)}}
function rshop(){const g=$('#grid');if(!prods){g.innerHTML='<div class="sp" style="grid-column:1/3"></div>';return}
 g.innerHTML=P().map(p=>{const q=cart[p.id]||0,so=p.status==='sold_out';return `<div class="nz"><div class="gl pr"><div class="ph">${EM[p.name]||'🎁'}${so?'<i>품절</i>':''}</div><b>${esc(p.name)}</b><em>${p.price}C</em><div class="qt"><button class="rp" onclick="qty(${p.id},-1)">−</button><span>${q}</span><button class="rp" onclick="qty(${p.id},1)">+</button></div></div></div>`}).join('');
 const bad=P().some(p=>p.status==='sold_out'&&cart[p.id]);$('#sum').textContent=tot()+'C';$('#dn').disabled=!tot()||bad;
 if(bad){$('#ot').textContent='담아둔 상품이 품절되었습니다. 취소 후 홈에서 다시 선택해주세요.';$('#ov').classList.add('on')}}
function qty(id,d){const p=P().find(x=>x.id===id);if(!p)return;const q=(cart[id]||0)+d;if(q<0||q>99||p.status==='sold_out')return;if(d>0&&tot()+p.price>coins)return toast('보유한 코인보다 많습니다.');cart[id]=q;rshop()}
function cancelCart(){cart={};$('#ov').classList.remove('on');go('home');cur='home'}
const submitOrder=()=>run(async()=>{const items=Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>({id:+id,qty:q}));if(!items.length)return;
 try{await API.me.order({items});show('order');await refresh()}
 catch(e){const k=e&&e.code;if(k==='SOLD_OUT'){toast('품절된 상품이 있어요'+(e.detail?': '+e.detail:''),3500);await loadProds();return}
  if(k==='UNAUTHORIZED'||k==='STALE_TOKEN')return;throw e}});
const cancelOrder=()=>run(async()=>{await API.me.cancelOrder();show('home');await refresh()});
const CHIP='<div class="chip"><div class="cf"></div><div class="cf bk"></div><div class="rim">'+Array.from({length:24},(_,i)=>`<i style="--i:${i}"></i>`).join('')+'</div></div>';$$('.coin').forEach(e=>e.innerHTML=CHIP);
(async()=>{if(!API.meSession())return location.replace('/');go('home');cv();poll()})();
</script></body></html>
