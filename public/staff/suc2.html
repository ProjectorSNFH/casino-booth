<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASINO · 정정 (suc2)</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--bg:#07080b;--p:rgba(22,24,32,.86);--ln:rgba(255,255,255,.12);--ink:#f1f3f6;--mut:#9aa1ab;--amb:#f0a83a;--red:#ff6b7a;--grn:#5fe0a0}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px Inter,system-ui,'Noto Sans KR',sans-serif;min-height:100dvh}
#bg{position:fixed;inset:0;z-index:0}.wr{position:relative;z-index:1;min-height:100dvh}
button{font:inherit;cursor:pointer;color:inherit}.rp{position:relative;overflow:hidden}.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.26);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.tb{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ln);background:var(--p);backdrop-filter:blur(8px)}.logo{font:17px Monoton,cursive;color:var(--amb)}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--p);font-weight:600}.btn.g{background:var(--amb);color:#111;border-color:var(--amb)}.btn.r{border-color:#6a2c33;color:var(--red);background:none}.btn.w{background:none;border-color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.big{width:100%;padding:18px;font-size:17px}
.in{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--ln);background:rgba(0,0,0,.35);color:#fff;font:14px Inter}.in:focus{outline:0;border-color:var(--amb)}
.cd{background:var(--p);border:1px solid var(--ln);border-radius:16px;backdrop-filter:blur(8px)}.c{padding:20px}.mu{color:var(--mut);font-size:12px}.bn{font:700 44px 'Space Grotesk';color:var(--amb)}.er2{color:var(--red);font-size:12.5px;margin:8px 0;min-height:16px}
.sp{position:relative;width:40px;height:40px;margin:30px auto}.sp i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 32px/1 'Space Grotesk';font-style:normal;opacity:0;animation:su 2s infinite}.sp i:nth-child(odd){color:#e8ebf0}.sp i:nth-child(even){color:#ff4d5e}.sp i:nth-child(2){animation-delay:.5s}.sp i:nth-child(3){animation-delay:1s}.sp i:nth-child(4){animation-delay:1.5s}
@keyframes su{0%{opacity:0;transform:scale(.5) rotate(-20deg)}6%{opacity:1;transform:scale(1) rotate(0)}22%{opacity:1}28%{opacity:0;transform:scale(1.35)}100%{opacity:0}}
#er{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:24px}#er.on{display:flex}#er h1{font-size:20px;margin:10px 0 6px}#er p{color:var(--mut);margin:0 0 20px}
.tt{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:600;font-size:13px;padding:9px 16px;border-radius:20px;z-index:40;display:none}
.tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--ln)}.tag.a{color:var(--grn);border-color:#2c5a45}.tag.p{color:var(--amb);border-color:#5a4718}.tag.b{color:var(--red);border-color:#6a2c33}.tag.d{color:#7a828a}
.hv .btn:hover{transform:translateY(-1px);filter:brightness(1.18)}.hv tbody tr:hover{background:#ffffff08}.btn{transition:.15s}
.lay{max-width:1100px;margin:0 auto;padding:22px 26px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{padding:10px 18px;border-radius:10px;border:1px solid var(--ln);background:none;font-weight:600;color:var(--mut)}.tabs .on{background:rgba(240,168,58,.14);color:var(--amb);border-color:#5a4718}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--ln)}td{padding:10px;border-bottom:1px solid var(--ln)}.p{color:var(--grn)}.n{color:var(--red)}.fm{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:10px;margin-top:16px}.gl{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;margin-bottom:10px}.gl .cn{font:700 22px 'Space Grotesk';margin:0 16px}.md{display:none;position:fixed;inset:0;background:#000a;z-index:25;align-items:center;justify-content:center}.md.on{display:flex}.md .cd{width:400px;max-width:92vw;padding:24px}label{display:block}.gi{width:90px;text-align:center;font:700 18px 'Space Grotesk'}.kd{font-size:11px;color:var(--mut);border:1px solid var(--ln);border-radius:20px;padding:2px 8px}.ac{white-space:nowrap}.ac .btn{padding:6px 10px;font-size:12px}.ru{color:var(--mut);font-family:'Space Grotesk'}</style></head><body class="hv"><canvas id="bg"></canvas><div class="tt" id="tt"></div>
<div id="er"><div><div style="font-size:34px">🌐</div><h1>오류가 발생했습니다</h1><p>연결 지연 또는 연결하는 중에 오류가 발생하였습니다.</p><button class="btn g" onclick="location.reload()">↻ 새로고침</button></div></div>
<div class="wr"><div class="tb"><span class="logo">CASINO</span><b>정정 · suc2 (Advanced)</b><span class="mu">수정·삭제 내역은 감사 기록에 자동 보관됩니다</span></div><div class="lay"><div class="rw" style="display:flex;gap:10px;max-width:460px"><input class="in" id="q" inputmode="numeric" maxlength="3" placeholder="식별번호 (예: 211)"><button class="btn g rp" style="flex:none;white-space:nowrap" onclick="find()">조회</button><button class="btn rp" style="flex:none" id="rl" onclick="reload()" title="다시 불러오기">↻</button></div><div id="who" class="mu" style="margin-top:10px"></div><div class="tabs"><button id="a1" class="on rp" onclick="T('t')">TList (코인 기록)</button><button id="a2" class="rp" onclick="T('g')">GList (참여 횟수)</button></div><div id="c"></div></div></div>
<div class="md" id="md"><div class="cd"><h3 style="margin:0 0 8px" id="mt"></h3><p class="mu" style="line-height:1.6" id="mp"></p><div style="display:flex;gap:10px"><button class="btn big rp" onclick="mdc()">취소</button><button class="btn r big rp" style="background:#3a1c20" id="mo" onclick="mok()">확인</button></div></div></div>
<div class="md" id="ed"><div class="cd"><h3 style="margin:0 0 12px" id="et"></h3><label class="mu">내용</label><input class="in" id="ec" maxlength="120"><label class="mu" style="margin-top:10px;display:block">변화량 (정수)</label><input class="in" id="edl" type="number" step="1"><div class="er2" id="ee"></div><div style="display:flex;gap:10px"><button class="btn big rp" onclick="edc()">취소</button><button class="btn g big rp" onclick="eds()">저장</button></div></div></div>
<script src="/js/casino-api.js"></script><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
(()=>{const c=$('#bg'),x=c.getContext('2d'),S=22,rs=()=>{c.width=innerWidth;c.height=innerHeight};rs();addEventListener('resize',rs);const f=t=>{const h=c.height,pf=(t/5200)%1.5;x.clearRect(0,0,c.width,h);for(let y=S/2;y<h;y+=S)for(let u=S/2;u<c.width;u+=S){const d=1-y/h+Math.sin(u/70+t/1100)*.025,k=Math.max(0,1-Math.abs(d-pf)*4.5);x.fillStyle=`rgba(255,255,255,${.06+.45*k})`;x.beginPath();x.arc(u,y,1+1.2*k,0,6.3);x.fill()}requestAnimationFrame(f)};requestAnimationFrame(f)})();
addEventListener('pointerdown',e=>{const t=e.target.closest('.rp');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.5,i=document.createElement('i');i.className='rip';i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(i);setTimeout(()=>i.remove(),600)});
const SUIT='<div class="sp"><i>♠︎</i><i>♥︎</i><i>♣︎</i><i>♦︎</i></div>',toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
const SESS=(code)=>{const s=CasinoAPI.staffSession();return !s||s.station!==code};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(3,'0');
const hhmm=t=>{try{return new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){return ''}};
const msg=e=>(e.message||'처리할 수 없어요')+(e.detail?` (${typeof e.detail==='string'?e.detail:JSON.stringify(e.detail)})`:'');
const ST=CasinoAPI.staff,bad=SESS('suc2');
if(bad)location.replace('/staff/');CasinoAPI.onSessionLost(()=>location.replace('/staff/'));
const GK=['HALLIGALLI','SKEWER','CHAMCHAMCHAM','JOKER','RANDOMBALL','TABLESOCCER'],GN={HALLIGALLI:'할리갈리',SKEWER:'꼬치의 달인',CHAMCHAMCHAM:'참참참',JOKER:'조커 뽑기',RANDOMBALL:'랜덤 공',TABLESOCCER:'테이블 축구'},SL={active:'활성',pending:'대기',done:'퇴장',banned:'제한'};
let D=null,cur=null,tab='t',busy=0,mAct=null,eid=null,eo=null;
async function run(f){busy++;try{await f()}catch(e){fail(e)}finally{busy--}}
function fail(e){console.error(e);const k=e&&e.code;if(k==='UNAUTHORIZED'||k==='STALE_TOKEN'){location.replace('/staff/');return}
 if(e&&e.status>=400&&e.status<500){toast(k==='BALANCE_LOW'?'이렇게 고치면 잔고가 0보다 작아져서 할 수 없어요.':k==='BAD_REQUEST'?'입력값을 확인해주세요 (변화량은 −1000~1000 정수, 내용은 60자 이내).':msg(e));return}$('#er').classList.add('on')}
async function load(id){D=await ST.adjustCard({card_id:id});cur=id;R()}
function find(){const v=parseInt($('#q').value,10);if(!(v>=1&&v<=999)){toast('식별번호는 1~999 사이 숫자예요');return}run(async()=>{try{await load(v)}catch(e){if(e&&e.status===404){toast('해당 식별번호를 찾을 수 없습니다');return}throw e}})}
const reload=()=>{if(cur)run(()=>load(cur))};
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
function T(t){tab=t;$('#a1').classList.toggle('on',t==='t');$('#a2').classList.toggle('on',t==='g');R()}
function R(){const c=$('#c');if(!D){c.innerHTML='<div class="mu">식별번호를 입력하고 조회를 눌러주세요.</div>';return}
 $('#who').innerHTML=`No.${pad(cur)} · <b style="color:#fff">${esc(D.card.mask_name)}</b> · ${SL[D.card.status]||D.card.status} · 잔고 <b style="color:var(--amb)">${D.balance}</b> · 최대 보유치 <b style="color:var(--amb)">${D.peak}</b>`;
 if(tab==='g'){const m=Object.fromEntries(D.glist.map(x=>[x.game,x.n]));c.innerHTML=GK.map(k=>`<div class="cd gl"><b>${GN[k]}</b><span style="display:flex;align-items:center;gap:8px"><input class="in gi" type="number" min="0" max="99" step="1" id="g_${k}" value="${m[k]||0}" onkeydown="if(event.key==='Enter')gset('${k}')"><button class="btn g rp" onclick="gset('${k}')">저장</button></span></div>`).join('')+`<div class="mu">참여 횟수를 값으로 직접 지정합니다 (0~99). 상품 구매 가능 여부(최소 참여 횟수)에 바로 반영돼요.</div>`;return}
 c.innerHTML=`<div class="cd"><table><thead><tr><th>#</th><th>시각</th><th>종류</th><th>내용</th><th>변화량</th><th>누적</th><th></th></tr></thead><tbody>${D.tlist.map(x=>`<tr><td>${x.id}</td><td>${hhmm(x.at)}</td><td><span class="kd">${esc(x.kind)}</span></td><td>${esc(x.content)}</td><td class="${x.coin_delta>0?'p':x.coin_delta<0?'n':''}">${x.coin_delta>0?'+':''}${x.coin_delta}</td><td class="ru">${x.running}</td><td class="ac"><button class="btn rp" onclick="eop(${x.id})">수정</button> <button class="btn r rp" onclick="del(${x.id})">삭제</button></td></tr>`).join('')||'<tr><td colspan=7 class="mu">기록이 없습니다</td></tr>'}</tbody></table></div>
 <div class="cd c" style="margin-top:16px"><b>정정 기록 추가</b><div class="fm" style="grid-template-columns:2fr 1fr auto"><input class="in" id="rs" maxlength="60" placeholder="사유 (예: 할리갈리 승자 반대로 처리)"><input class="in" id="dl" type="number" step="1" placeholder="변화량 (+/-)"><button class="btn g rp" onclick="add()">추가</button></div><div class="er2" id="e"></div><div class="mu">기존 기록을 고치려면 위 표에서 수정·삭제를 쓰세요. 잔고가 0보다 작아지는 변경은 서버가 막아요.</div></div>`}
const add=()=>run(async()=>{const r=$('#rs').value.trim(),dv=$('#dl').value.trim(),d=Number(dv);if(!r||dv===''||!Number.isInteger(d)){$('#e').textContent='사유와 변화량(정수)을 입력해주세요.';return}
 $('#e').textContent='';await ST.adjustAdd({card_id:cur,delta:d,reason:r});await load(cur);toast('정정 기록이 추가되었습니다')});
const ask=(t,p,label,fn)=>{$('#mt').textContent=t;$('#mp').textContent=p;$('#mo').textContent=label;mAct=fn;$('#md').classList.add('on')};
const mdc=()=>{mAct=null;$('#md').classList.remove('on')},mok=()=>{const f=mAct;mdc();if(f)f()};
const del=id=>{const x=D.tlist.find(r=>r.id===id);if(!x)return;ask(`#${id} 기록을 삭제할까요?`,`${x.content} (${x.coin_delta>0?'+':''}${x.coin_delta}) · 삭제한 기록은 감사 기록에 보관되고, 잔고와 최대 보유치가 다시 계산돼요.`,'삭제',()=>run(async()=>{await ST.adjustDelete({id});await load(cur);toast(`#${id} 기록을 삭제했습니다`)}))};
const eop=id=>{const x=D.tlist.find(r=>r.id===id);if(!x)return;eid=id;eo=x;$('#et').textContent=`#${id} 기록 수정`;$('#ec').value=x.content;$('#edl').value=x.coin_delta;$('#ee').textContent='';$('#ed').classList.add('on')};
const edc=()=>{eid=null;$('#ed').classList.remove('on')};
const eds=()=>{const c=$('#ec').value.trim(),dv=$('#edl').value.trim(),d=Number(dv);if(!c||dv===''||!Number.isInteger(d)){$('#ee').textContent='내용과 변화량(정수)을 입력해주세요.';return}
 const p={id:eid};if(c!==eo.content)p.content=c;if(d!==eo.coin_delta)p.coin_delta=d;if(Object.keys(p).length===1){edc();return}
 run(async()=>{try{await ST.adjustEdit(p)}catch(e){if(e&&e.status>=400&&e.status<500){$('#ee').textContent=e.code==='BALANCE_LOW'?'이렇게 고치면 잔고가 0보다 작아져서 할 수 없어요.':msg(e);return}throw e}edc();await load(cur);toast(`#${p.id} 기록을 수정했습니다`)})};
const gset=k=>run(async()=>{const v=$('#g_'+k).value.trim(),n=Number(v);if(v===''||!Number.isInteger(n)||n<0||n>99){toast('참여 횟수는 0~99 정수예요');return}
 await ST.adjustGames({card_id:cur,game:k,n});const i=D.glist.findIndex(x=>x.game===k);if(i>=0)D.glist[i].n=n;else D.glist.push({game:k,n});toast(`${GN[k]} 참여 횟수를 ${n}회로 저장했습니다`)});
if(!bad)R();
</script></body></html>
