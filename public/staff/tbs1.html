<div id="er"><div><div style="font-size:34px"><script>document.write(ico("err"));</script></div><h1>오류가 발생했습니다</h1><p>연결 지연 또는 연결하는 중에 오류가 발생하였습니다.</p><button class="btn g" onclick="location.reload()">↻ 새로고침</button></div></div>
<div class="wr"><div class="tv"><div class="nz hd"><div class="gl"><span class="logo" style="font-family:Monoton,cursive">CASINO</span><span class="rf">● 다음 갱신까지 <b id="cd">10</b>초</span></div></div><h1><script>document.write(ico("trophy"));</script> 명예의 <span>전당</span></h1><div class="pod" id="pod"></div><div class="lw" id="lw"></div></div></div><div id="pm"><div class="cd c" style="width:min(560px,100%);max-height:90dvh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:17px">우승자 확인 (직원 전용)</b><button class="btn rp" onclick="closePm()">닫기</button></div><div class="mu" style="margin-bottom:8px">PIN을 넣고 확인할 순위의 "실명 보기"를 누르세요. 20초 뒤 자동으로 사라지고, 열람 기록이 남습니다.</div><input class="in" id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><div class="er2" id="pe"></div><div id="pl"></div></div></div><script src="/js/casino-api.js"></script><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
(()=>{const c=$('#bg'),x=c.getContext('2d'),S=22,rs=()=>{c.width=innerWidth;c.height=innerHeight};rs();addEventListener('resize',rs);const f=t=>{const h=c.height,pf=(t/5200)%1.5;x.clearRect(0,0,c.width,h);for(let y=S/2;y<h;y+=S)for(let u=S/2;u<c.width;u+=S){const d=1-y/h+Math.sin(u/70+t/1100)*.025,k=Math.max(0,1-Math.abs(d-pf)*4.5);x.fillStyle=`rgba(255,255,255,${.06+.45*k})`;x.beginPath();x.arc(u,y,1+1.2*k,0,6.3);x.fill()}requestAnimationFrame(f)};requestAnimationFrame(f)})();
addEventListener('pointerdown',e=>{const t=e.target.closest('.rp');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.5,i=document.createElement('i');i.className='rip';i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(i);setTimeout(()=>i.remove(),600)});
const SUIT='<div class="sp"><i>♠︎</i><i>♥︎</i><i>♣︎</i><i>♦︎</i></div>',toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
const SESS=(code)=>{const s=CasinoAPI.staffSession();return !s||s.station!==code};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(3,'0');
const hhmm=t=>{try{return new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){return ''}};
const msg=e=>(e.message||'처리할 수 없어요')+(e.detail?` (${typeof e.detail==='string'?e.detail:JSON.stringify(e.detail)})`:'');
const ST=CasinoAPI.staff,bad=SESS('tbs1'),WIN=10;
if(bad)location.replace('/staff/');CasinoAPI.onSessionLost(()=>location.replace('/staff/'));
let ROWS=null,sig='',fails=0,sq=0,prev=[],first=true,busyP=0;const rows=new Map(),rv=new Map();
const pod=$('#pod'),lw=$('#lw'),MD=[ico('m1'),ico('m2'),ico('m3')],ROWH=50;
const medal=p=>MD[Math.min(p.rank,3)-1]||ico('m4');
function render(r){const pl=r.length<4;pod.style.display=pl?'none':'flex';
 if(!pl){const top=r.slice(0,3);pod.innerHTML=[1,0,2].map(i=>{const p=top[i],nw=!prev.includes(p.id);return `<div class="nz"><div class="gl pc ${i===0?'p1':''}"><div class="in2${nw?' pop':''}"><div class="m">${medal(p)}</div><div class="nm">${esc(p.n)}</div><div class="cv">${p.v}<span class="u">코인</span></div></div></div></div>`}).join('');prev=top.map(p=>p.id)}else prev=[];
 const cap=Math.max(1,Math.floor((lw.getBoundingClientRect().height-24)/ROWH));
 list(pl?r:r.slice(3,3+cap),pl)}
function list(items,plain){const ns=new Set(items.map(p=>p.id)),old=[...rows.keys()],rem=old.filter(n=>!ns.has(n)),kept=old.filter(n=>ns.has(n)),fr=new Map(),wr=lw.getBoundingClientRect();
 let em=$('#em');if(!items.length){if(!em){em=document.createElement('div');em.id='em';em.textContent='아직 순위가 없습니다';lw.prepend(em)}}else if(em)em.remove();
 kept.forEach(n=>fr.set(n,rows.get(n).getBoundingClientRect().top));
 rem.forEach(n=>{const e=rows.get(n),r=e.getBoundingClientRect();e.style.cssText+=`position:absolute;left:${r.left-wr.left}px;top:${r.top-wr.top}px;width:${r.width}px`;e.classList.add('ex');setTimeout(()=>e.remove(),420);rows.delete(n)});
 items.forEach(p=>{let e=rows.get(p.id);if(!e){e=document.createElement('div');e.className='lr en';rows.set(p.id,e)}e.innerHTML=`<span class="rk">${p.rank}</span><span class="nm">${esc(p.n)}</span><span class="cv">${p.v}${plain?' 코인':''}</span>`;lw.appendChild(e)});
 kept.forEach(n=>{const e=rows.get(n),dy=fr.get(n)-e.getBoundingClientRect().top;e.style.transition='none';e.style.transform=dy?`translateY(${dy}px)`:'none';requestAnimationFrame(()=>{e.style.transition='transform .55s cubic-bezier(.34,1.56,.64,1)';e.style.transform='translateY(0)'})});
 items.forEach(p=>{const e=rows.get(p.id);if(e.classList.contains('en'))requestAnimationFrame(()=>requestAnimationFrame(()=>{e.classList.remove('en');e.classList.add('ea')}))})}
async function sync(){const my=++sq,r=await ST.hofList();if(my!==sq)return;fails=0;$('#er').classList.remove('on');
 const rs=(r.ranks||[]).map(x=>({rank:x.rank,id:x.card_id,n:x.n,v:x.v})),s=JSON.stringify(rs);
 if(first){first=false;lw.innerHTML=''}
 if(s!==sig){sig=s;ROWS=rs;render(rs);if($('#pm').classList.contains('on'))drawPm()}}
async function refresh(){if(bad)return;try{await sync()}catch(e){const k=e&&e.code;if(k==='UNAUTHORIZED'||k==='STALE_TOKEN'||k==='FORBIDDEN'){location.replace('/staff/');return}console.error(e);if(ROWS===null||++fails>=3)$('#er').classList.add('on')}}
/* 우승자 실명 확인: Shift+P. PIN 필요, 상위 WIN위만, 서버에 열람 기록이 남음 */
function drawPm(){$('#pl').innerHTML=(ROWS||[]).slice(0,WIN).map(p=>{const v=rv.get(p.id);return `<div class="pr"><span class="rk">${p.rank}</span><b>${pad(p.id)}</b><span class="nm">${esc(p.n)}</span>${v?`<span class="rv">${esc(v.name)} · ${esc(v.sid)}</span>`:`<button class="btn rp" onclick="reveal(${p.id})">실명 보기</button>`}</div>`}).join('')||'<div class="mu">순위가 아직 없어요</div>'}
function openPm(){if(bad)return;$('#pin').value='';$('#pe').textContent='';drawPm();$('#pm').classList.add('on');$('#pin').focus()}
function closePm(){$('#pm').classList.remove('on');$('#pin').value='';$('#pe').textContent='';rv.forEach(v=>clearTimeout(v.t));rv.clear()}
async function reveal(id){const pin=$('#pin').value;if(!pin){$('#pe').textContent='PIN을 입력하세요';return}if(busyP)return;busyP=1;$('#pe').textContent='';
 try{const r=await ST.hofPii({card_id:id,pin});if(rv.has(id))clearTimeout(rv.get(id).t);rv.set(id,{name:r.name,sid:r.sid,t:setTimeout(()=>{rv.delete(id);drawPm()},20000)})}
 catch(e){const k=e&&e.code;if(k==='UNAUTHORIZED'||k==='STALE_TOKEN'){location.replace('/staff/');return}$('#pe').textContent=msg(e)}
 finally{busyP=0;drawPm()}}
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#pm').classList.contains('on')){closePm();return}if(e.shiftKey&&e.code==='KeyP'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){e.preventDefault();openPm()}});
addEventListener('resize',()=>{if(ROWS)render(ROWS)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
let t=10;setInterval(()=>{t--;if(t<=0){t=10;refresh()}$('#cd').textContent=t},1000);
if(!bad){lw.innerHTML=SUIT;refresh()}
</script></body></html>
