<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASINO · 입장</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--bg:#07080b;--ink:#f1f3f6;--mut:#9aa1ab;--amb:#f0a83a;--red:#ff6b7a;--grn:#5fe0a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,'Noto Sans KR',sans-serif;min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0}
.app{position:relative;z-index:1;width:100%;max-width:420px;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 46px) 16px 96px}
.nz{position:relative;border-radius:22px}
.nz::before{content:"";position:absolute;inset:-4px;border-radius:inherit;background:linear-gradient(120deg,#ff2bd6,#2b8cff,#22ffc4);filter:blur(16px);opacity:.5;animation:hue 9s linear infinite}
@keyframes hue{to{filter:blur(16px) hue-rotate(360deg)}}
.gl{position:relative;border-radius:inherit;background:rgba(22,24,32,.55);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.hd{margin-bottom:16px;border-radius:18px}.hd .gl{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.logo{font-family:Monoton,cursive;font-size:20px;letter-spacing:.04em;text-shadow:0 0 12px #ff2bd6aa,0 0 24px #2b8cff88}
.idb{text-align:right;line-height:1}.idb small{display:block;font-size:10px;color:var(--mut);margin-bottom:3px}.idb b{font:700 26px 'Space Grotesk';color:var(--amb)}
.s{display:none;flex:1;flex-direction:column;animation:in .3s ease}.s.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:21px;margin:0 0 6px}p{color:var(--mut);font-size:14px;line-height:1.6;margin:0 0 20px}
.c{padding:20px}.center{text-align:center}.mid{margin:auto 0;text-align:center;width:100%}.ic{font-size:34px;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:15px;border-radius:14px;font-weight:600;font-size:15px;background:none;border:1.5px solid #fff;color:#fff;position:relative;overflow:hidden}
.bg{background:var(--amb);border-color:var(--amb);color:#111}.bo{border-color:var(--red);color:var(--red)}.bg:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.rp{position:relative;overflow:hidden}.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.26);transform:scale(0);animation:rp .65s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.sp{position:relative;width:46px;height:46px;margin:0 auto 20px}.sp i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 38px/1 'Space Grotesk',sans-serif;font-style:normal;opacity:0;animation:su 2s infinite}.sp i:nth-child(odd){color:#e8ebf0}.sp i:nth-child(even){color:#ff4d5e}.sp i:nth-child(2){animation-delay:.5s}.sp i:nth-child(3){animation-delay:1s}.sp i:nth-child(4){animation-delay:1.5s}@keyframes su{0%{opacity:0;transform:scale(.5) rotate(-20deg)}6%{opacity:1;transform:scale(1) rotate(0)}22%{opacity:1}28%{opacity:0;transform:scale(1.35)}100%{opacity:0}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:auto}
.k{background:none;border:0;color:var(--ink);font:500 24px 'Space Grotesk';height:58px;border-radius:29px}
.coin{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff2b8,#f0a83a 65%,#b9741a);box-shadow:0 0 14px #f0a83a88;animation:sc 2.4s linear infinite}@keyframes sc{50%{transform:scaleX(.15)}}
#dv{position:fixed;top:0;left:0;right:0;z-index:20;background:#000c;display:flex;gap:4px;overflow-x:auto;padding:7px}
#dv button{flex:none;font:11px Inter;padding:5px 9px;border-radius:20px;border:1px solid #333;background:#161616;color:#aaa}#dv .on{background:var(--amb);color:#111}

.bxs{display:flex;gap:10px;justify-content:center;padding:16px}.bxs b{width:62px;height:72px;border-radius:14px;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font:700 30px 'Space Grotesk'}.bxs b.f{border-color:var(--amb);box-shadow:0 0 14px #f0a83a66}
.lk{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;margin:18px 0 8px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}label:first-child{margin-top:0}
.in{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:#fff;font:16px Inter}
.em{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}
.sn{font:700 34px 'Space Grotesk';letter-spacing:.18em;color:var(--amb);padding:16px}
</style></head><body><canvas id="bg"></canvas><div id="dv"></div><div class="app"><div class="nz hd"><div class="gl"><span class="logo">CASINO</span></div></div>
<section class="s on" id="chk"><div class="mid"><div class="sp"></div><h1>세션 확인 중</h1><p>이 기기의 로그인 정보를 확인하고 있어요.</p></div></section>
<section class="s" id="auto"><div class="mid"><div class="sp"></div><h1>이미 로그인되어 있어요</h1><p>기존 카드로 이동합니다.</p></div></section>
<section class="s" id="input"><h1>식별번호 입력</h1><p>발급 데스크에서 받은 3자리 번호를 입력하세요.</p>
<div class="nz"><div class="gl bxs"><b></b><b></b><b></b></div></div>
<button class="lk" onclick="go('find')">이미 발급받은 카드가 있나요? 기존 카드 찾기</button><div id="kp"></div></section>
<section class="s" id="load"><div class="mid"><div class="sp"></div><h1>확인 중</h1><p>통신 상태에 따라 몇 초 걸릴 수 있어요.</p></div></section>
<section class="s" id="wait"><div class="mid"><div class="sp"></div><h1>담당 스태프 확인 대기</h1><p>발급 데스크 화면에 아래 이름이 뜨면<br>스태프에게 보여주고 확인을 요청해주세요.</p><div class="nz"><div class="gl center sn" id="sn">abcde</div></div></div></section>
<section class="s" id="find"><h1>기존 카드 찾기</h1><p>발급 때 입력한 학번과 이름을 입력하세요.</p>
<div class="nz"><div class="gl c"><label>학번 (숫자 5자리)</label><input class="in" id="fs" inputmode="numeric" maxlength="5"><label>이름 (한글 2~5자)</label><input class="in" id="fn" maxlength="5"><div class="em" id="fe"></div></div></div>
<div class="row" style="margin-top:auto"><button class="btn" onclick="go('input')">뒤로</button><button class="btn bg" onclick="find()">찾기</button></div></section>
<section class="s" id="found"><div class="mid"><div class="nz"><div class="gl c center"><p>기존 식별번호</p><div class="idb" style="text-align:center"><b style="font-size:52px">047</b></div><p style="margin-top:14px">이 번호로 새 기기를 연결합니다.<br>스태프가 학생증으로 확인합니다.</p><button class="btn bg" onclick="$('#sn').textContent=rn();go('wait')">이 번호로 재연결</button></div></div></div></section>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
(()=>{const c=$('#bg'),x=c.getContext('2d'),S=22,rs=()=>{c.width=innerWidth;c.height=innerHeight};rs();addEventListener('resize',rs);
const f=t=>{const h=c.height,pf=(t/5200)%1.5;x.clearRect(0,0,c.width,h);for(let y=S/2;y<h;y+=S)for(let u=S/2;u<c.width;u+=S){const d=1-y/h+Math.sin(u/70+t/1100)*.025,k=Math.max(0,1-Math.abs(d-pf)*4.5);x.fillStyle=`rgba(255,255,255,${.07+.5*k})`;x.beginPath();x.arc(u,y,1+1.3*k,0,6.3);x.fill()}requestAnimationFrame(f)};requestAnimationFrame(f)})();
addEventListener('pointerdown',e=>{const t=e.target.closest('.rp,.btn');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.5,i=document.createElement('i');i.className='rip';i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(i);setTimeout(()=>i.remove(),650)});
function mk(id,ic,t,d,btn){const s=document.createElement('section');s.className='s';s.id=id;s.innerHTML=`<div class="mid"><div class="nz"><div class="gl c center"><div class="ic">${ic}</div><h1>${t}</h1><p>${d}</p>${btn||''}</div></div></div>`;$('.app').appendChild(s)}
function go(n){$$('.s').forEach(e=>e.classList.toggle('on',e.id===n));$$('#dv button').forEach(b=>b.classList.toggle('on',b.dataset.n===n));window.hook&&hook(n)}
function dev(o){for(const k in o){const e=document.createElement('button');e.textContent=o[k];e.dataset.n=k;e.onclick=()=>window.demo&&demo[k]?demo[k]():go(k);$('#dv').appendChild(e)}}
function keypad(el,left,k,d,l){el.className='kp';[1,2,3,4,5,6,7,8,9,'L',0,'D'].forEach(v=>{const b=document.createElement('button');b.className='k rp';b.textContent=v==='L'?left:v==='D'?'⌫':v;if(v==='L'&&!left)b.style.visibility='hidden';b.onclick=()=>v==='D'?d():v==='L'?l():k(String(v));el.appendChild(b)})}

mk('e-nf','🔎','발급되지 않은 번호입니다','식별번호를 다시 확인하거나 발급 데스크에 문의해주세요.','<button class="btn" onclick="go(\'input\')">다시 입력하기</button>');
mk('e-use','📵','이미 사용 중인 번호입니다','다른 기기에서 사용 중이에요. 기기를 바꿨다면 기존 카드 찾기를 이용하세요.','<button class="btn" onclick="go(\'input\')">다시 입력하기</button>');
mk('e-cf','⚡','동시 요청이 감지되었습니다','다른 사람이 같은 번호로 동시에 요청했습니다.','<button class="btn" onclick="go(\'input\')">다시 입력하기</button>');
mk('e-mis','❌','정보가 일치하지 않습니다','학번과 이름을 다시 확인해주세요.','<button class="btn" onclick="go(\'find\')">다시 입력하기</button>');
mk('err','🌐','오류가 발생했습니다','연결 지연 또는 연결하는 중에 오류가 발생하였습니다.','<button class="btn" onclick="location.reload()">↻ 새로고침</button>');
const dg=[],rn=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'abcdefghijklmnopqrstuvwxyz'[b%26]).join('');
function rb(){$$('.bxs b').forEach((b,i)=>{b.textContent=dg[i]||'';b.className=i===dg.length?'f':''})}
keypad($('#kp'),'',d=>{if(dg.length<3){dg.push(d);rb();if(dg.length===3)setTimeout(()=>{go('load');setTimeout(()=>{$('#sn').textContent=rn();go('wait')},900)},180)}},()=>{dg.pop();rb()});
const FS=$('#fs'),FN=$('#fn');let comp=0;const hg=()=>FN.value=FN.value.replace(/[^가-힣]/g,'').slice(0,5);
FN.addEventListener('compositionstart',()=>comp=1);FN.addEventListener('compositionend',()=>{comp=0;hg()});FN.addEventListener('input',()=>{if(!comp)hg()});FS.addEventListener('input',()=>FS.value=FS.value.replace(/\D/g,'').slice(0,5));
function find(){if(!/^\d{5}$/.test(FS.value)||!/^[가-힣]{2,5}$/.test(FN.value)){$('#fe').textContent='학번은 숫자 5자리, 이름은 한글 2~5자로 입력해주세요.';return}$('#fe').textContent='';go('load');setTimeout(()=>go(FS.value==='20231'?'found':'e-mis'),900)}
window.hook=n=>{if(n==='input'){dg.length=0;rb()}};
dev({chk:'세션확인',auto:'자동로그인',input:'입력',load:'확인중',wait:'스태프대기',find:'카드찾기',found:'찾음',  'e-nf':'미발급','e-use':'사용중','e-cf':'충돌','e-mis':'불일치',err:'오류'});
setTimeout(()=>go(localStorage.getItem('cs_tok')?'auto':'input'),900);rb();
$$('.sp').forEach(e=>e.innerHTML='<i>♠︎</i><i>♥︎</i><i>♣︎</i><i>♦︎</i>');</script></body></html>
