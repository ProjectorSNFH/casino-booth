<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASINO · 발급 데스크 (suc1)</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>

.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--p);font-weight:600}.btn.g{background:var(--amb);color:#111;border-color:var(--amb)}.btn.r{border-color:#6a2c33;color:var(--red);background:none}.btn.w{background:none;border-color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.big{width:100%;padding:18px;font-size:17px}

.hv .btn:hover{transform:translateY(-1px);filter:brightness(1.18)}.hv tbody tr:hover{background:#ffffff08}.btn{transition:.15s}
.lay{display:flex;min-height:calc(100dvh - 90px)}.sd{width:350px;flex:none;border-right:1px solid var(--ln);padding:20px;background:var(--p);overflow-y:auto}.sd h3{margin:0 0 12px;font-size:14px}.sd h3.s{margin-top:22px;color:var(--mut)}
.mn{flex:1;padding:22px 26px;overflow-x:auto}label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px}.pt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.pt button{padding:4px 10px;border-radius:20px;border:1px solid var(--ln);background:none;font-size:11px;color:var(--mut)}.pt .on.a{color:var(--grn);border-color:#2c5a45;background:#1c3a2c}.pt .on.e{color:var(--red);border-color:#6a2c33;background:#3a1c20}
.is{display:none;background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0}.is.on{display:block}.is div{display:flex;justify-content:space-between;margin-bottom:8px}.is b{font-family:'Space Grotesk';font-size:15px}.sn{color:var(--grn)}.sn.w{color:var(--mut)}
.rq{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;margin-bottom:8px}.rq .btn{padding:6px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mut);padding:0 10px 10px;border-bottom:1px solid var(--ln)}td{padding:11px 10px;border-bottom:1px solid var(--ln)}.idn{font:700 15px 'Space Grotesk';color:var(--amb)}.cn{font-family:'Space Grotesk';color:var(--amb)}.cn.z{color:var(--red)}.rv{background:none;border:0;color:var(--mut);font-size:12px;margin-left:6px}
.md{display:none;position:fixed;inset:0;background:#000a;z-index:25;align-items:center;justify-content:center}.md.on{display:flex}.md .cd{width:360px;padding:24px}</style></head><body class="hv"><canvas id="bg"></canvas><div id="dv"></div><div class="tt" id="tt"></div>
<div id="er"><div><div style="font-size:34px">🌐</div><h1>오류가 발생했습니다</h1><p>연결 지연 또는 연결하는 중에 오류가 발생하였습니다.</p><button class="btn g" onclick="location.reload()">↻ 새로고침</button></div></div>
<div class="wr"><div class="tb"><span class="logo">CASINO</span><b>발급 데스크 · suc1</b><span class="mu" id="stat"></span></div>
<div class="lay"><aside class="sd"><h3>회차 관리</h3><div class="cd c" style="padding:12px 14px"><div class="pt"><span>1부 (001~500)</span><span id="p1"></span></div><div class="pt" style="margin:0"><span>2부 (501~999)</span><span id="p2"></span></div></div>
<h3 class="s">새 카드 발급</h3><label>학번 (숫자 5자리)</label><input class="in" id="sid" inputmode="numeric" maxlength="5" placeholder="예: 20231"><label>이름 (한글 2~5자)</label><input class="in" id="nm" maxlength="5" placeholder="예: 홍길동"><label>회차</label><select class="in" id="pt"><option value="1">1부</option><option value="2">2부</option></select>
<div class="mu" id="capl" style="margin:8px 0 0"></div><div class="er2" id="er2"></div>
<div class="is" id="is"><div><span class="mu">식별번호</span><b id="isn"></b></div><div><span class="mu">참여자 세션명</span><b class="sn w" id="iss">대기 중…</b></div><div class="mu" style="display:block;line-height:1.5">참여자 화면에 뜬 세션명과 같은지 확인한 뒤 확인을 눌러주세요.</div></div>
<button class="btn g big rp" id="mb" onclick="issue()">발급</button><button class="btn big rp" id="cb" style="display:none;margin-top:8px" onclick="cancelIssue()">발급 취소</button>
<h3 class="s">재연결 요청 <span class="mu" id="rqn"></span></h3><div id="rqs"></div></aside>
<main class="mn"><div style="display:flex;gap:10px;margin-bottom:16px"><input class="in" id="sq" placeholder="식별번호 또는 이름 검색" oninput="R()"></div>
<table><thead><tr><th>번호</th><th>이름</th><th>상태</th><th>진행 중 게임</th><th>코인</th><th>시각</th><th></th></tr></thead><tbody id="rows"></tbody></table></main></div>
<div class="md" id="md"><div class="cd"><h3 style="margin:0 0 8px">이 카드를 이용 제한할까요?</h3><p class="mu" style="line-height:1.6">제한하면 참여자 화면이 즉시 차단 화면으로 바뀌고 되돌릴 수 없습니다.</p><div class="rw" style="display:flex;gap:10px"><button class="btn big rp" onclick="mdc()">취소</button><button class="btn r big rp" style="background:#3a1c20" onclick="ban()">이용 제한</button></div></div></div></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
(()=>{const c=$('#bg'),x=c.getContext('2d'),S=22,rs=()=>{c.width=innerWidth;c.height=innerHeight};rs();addEventListener('resize',rs);const f=t=>{const h=c.height,pf=(t/5200)%1.5;x.clearRect(0,0,c.width,h);for(let y=S/2;y<h;y+=S)for(let u=S/2;u<c.width;u+=S){const d=1-y/h+Math.sin(u/70+t/1100)*.025,k=Math.max(0,1-Math.abs(d-pf)*4.5);x.fillStyle=`rgba(255,255,255,${.06+.45*k})`;x.beginPath();x.arc(u,y,1+1.2*k,0,6.3);x.fill()}requestAnimationFrame(f)};requestAnimationFrame(f)})();
addEventListener('pointerdown',e=>{const t=e.target.closest('.rp');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.5,i=document.createElement('i');i.className='rip';i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(i);setTimeout(()=>i.remove(),600)});
const SUIT='<div class="sp"><i>♠︎</i><i>♥︎</i><i>♣︎</i><i>♦︎</i></div>',toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
window.FAIL=false;const lat=()=>new Promise((r,j)=>setTimeout(()=>window.FAIL?j(1):r(),300)),run=async f=>{try{await f()}catch(e){$('#er').classList.add('on')}};
const rn=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'abcdefghijklmnopqrstuvwxyz'[b%26]).join('');
function dev(o){for(const k in o){const b=document.createElement('button');b.textContent=k;b.className='rp';b.onclick=o[k];$('#dv').appendChild(b)}}


const CAP={1:500,2:499},AC=15;let C=null,PS={1:'active',2:'ended'},cur=null,sess=null,RQ=[],nid={1:213,2:501},rv={},delId=null,fill=0,comp=0;
const SEED={C:[{id:211,n:'홍길동',sid:'20231',part:1,st:'active',coins:37,game:'할리갈리',at:'14:02'},{id:209,n:'박서영',sid:'21042',part:1,st:'active',coins:0,game:'',at:'13:57'},{id:188,n:'이하진',sid:'20099',part:1,st:'banned',coins:12,game:'',at:'13:20'},{id:150,n:'김민수',sid:'22001',part:1,st:'done',coins:3,game:'',at:'13:10'}],RQ:[{id:209,sess:'xkqpd'}]};
/* 서버 어댑터: 발급 가능 여부(회차/활성 15/정원/학번 중복)는 서버가 판단, 발급 슬롯은 stations.current_card_id로 복구 */
const API={async load(){await lat();return JSON.parse(localStorage.getItem('s1')||'null')||SEED},save(){localStorage.setItem('s1',JSON.stringify({C,PS,cur,sess,RQ,nid}))},async act(){await lat()}};
const mask=n=>n.length<3?n[0]+'*':n[0]+'*'.repeat(n.length-2)+n.slice(-1),act=()=>(C?C.filter(c=>c.st==='active').length:0)+fill,cnt=p=>C.filter(c=>c.part===p).length;
function Pbtn(p){return `<span class="pt" style="margin:0;gap:6px"><button class="a rp ${PS[p]==='active'?'on':''}" onclick="setP(${p},'active')">진행중</button><button class="e rp ${PS[p]==='ended'?'on':''}" onclick="setP(${p},'ended')">종료</button></span>`}
function R(){const t=$('#rows');if(!C){t.innerHTML=`<tr><td colspan=7>${SUIT}</td></tr>`;return}API.save();$('#p1').innerHTML=Pbtn(1);$('#p2').innerHTML=Pbtn(2);
 const p=+$('#pt').value;$('#capl').innerHTML=`발급 ${cnt(p)} / ${CAP[p]}명 · 현재 활성 <b style="color:${act()>=AC?'var(--red)':'var(--ink)'}">${act()} / ${AC}</b>명`;$('#stat').textContent='활성 '+act()+' / '+AC;
 [...$('#pt').options].forEach(o=>o.disabled=PS[o.value]==='ended');
 $('#rqn').textContent=RQ.length?`(${RQ.length})`:'';$('#rqs').innerHTML=RQ.length?RQ.map((r,i)=>`<div class="rq"><span><b class="idn">No.${r.id}</b> <span class="sn">${r.sess}</span></span><span><button class="btn rp" onclick="rqNo(${i})">거절</button> <button class="btn g rp" onclick="rqOk(${i})">확인</button></span></div>`).join(''):'<div class="mu">대기 중인 재연결 요청이 없습니다</div>';
 const q=$('#sq').value.trim(),tier=s=>s==='banned'?2:s==='done'?1:0,L={active:'활성',pending:'대기',done:'퇴장',banned:'제한'},K={active:'a',pending:'p',done:'d',banned:'b'};
 t.innerHTML=[...C].filter(c=>!q||String(c.id).includes(q)||c.n.includes(q)).sort((a,b)=>tier(a.st)-tier(b.st)||a.id-b.id).map(c=>`<tr><td class="idn">No.${c.id}</td><td>${rv[c.id]?c.n:mask(c.n)}<button class="rv" onclick="rv[${c.id}]=!rv[${c.id}];R()">${rv[c.id]?'숨기기':'보기'}</button></td><td><span class="tag ${K[c.st]}">${L[c.st]}</span></td><td>${c.game||'-'}</td><td class="cn ${c.coins===0&&c.st==='active'?'z':''}">${c.coins}</td><td>${c.at}</td><td>${c.st==='active'?`<button class="btn rp" onclick="exitC(${c.id})">퇴장</button> <button class="btn r rp" onclick="delId=${c.id};$('#md').classList.add('on')">이용 제한</button>`:''}</td></tr>`).join('');
 const box=$('#is');box.classList.toggle('on',!!cur);$('#mb').textContent=cur?'확인':'발급';$('#mb').disabled=cur&&!sess;$('#mb').onclick=cur?confirmIssue:issue;$('#cb').style.display=cur?'block':'none';
 if(cur){$('#isn').textContent='No.'+cur;$('#iss').textContent=sess||'대기 중…';$('#iss').className='sn'+(sess?'':' w')}}
const setP=(p,v)=>run(async()=>{await API.act();PS[p]=v;if(v==='ended')C.forEach(c=>{if(c.st==='active'&&(p===1?c.id<=500:c.id>=501)){c.st='done';c.game=''}});R()});
const issue=()=>run(async()=>{const p=+$('#pt').value,s=$('#sid').value.trim(),n=$('#nm').value.trim(),e=$('#er2');e.textContent='';
 if(PS[p]==='ended'){e.textContent='이 회차는 이미 종료되었습니다.';return}if(act()>=AC){e.textContent='현재 활성 인원이 가득 찼습니다 (15/15). 기존 참여자가 퇴장해야 발급할 수 있습니다.';return}
 if(cnt(p)>=CAP[p]){e.textContent='이 회차의 발급 인원 제한에 도달했습니다.';return}if(!/^\d{5}$/.test(s)||!/^[가-힣]{2,5}$/.test(n)){e.textContent='학번은 숫자 5자리, 이름은 한글 2~5자로 입력해주세요.';return}
 if(C.some(c=>c.sid===s)){e.textContent='이미 등록된 학번입니다. 중복 발급할 수 없습니다.';return}
 await API.act();const id=nid[p]++;C.push({id,n,sid:s,part:p,st:'pending',coins:0,game:'',at:new Date().toTimeString().slice(0,5)});cur=id;sess=null;R()});
const confirmIssue=()=>run(async()=>{await API.act();const c=C.find(x=>x.id===cur);c.st='active';c.coins=5;cur=null;sess=null;$('#sid').value='';$('#nm').value='';R();toast('발급 완료 · WELCOME +5 기록')});
const cancelIssue=()=>run(async()=>{await API.act();C=C.filter(x=>x.id!==cur);cur=null;sess=null;R()});
const exitC=id=>run(async()=>{await API.act();const c=C.find(x=>x.id===id);c.st='done';c.game='';R()});
const mdc=()=>$('#md').classList.remove('on'),ban=()=>run(async()=>{await API.act();C.find(x=>x.id===delId).st='banned';mdc();R()});
const rqOk=i=>run(async()=>{await API.act();RQ.splice(i,1);R();toast('재연결 완료 · 새 기기 연결, 이전 기기는 종료됩니다')}),rqNo=i=>run(async()=>{await API.act();RQ.splice(i,1);R()});
const NM=$('#nm');NM.addEventListener('compositionstart',()=>comp=1);NM.addEventListener('compositionend',()=>{comp=0;NM.value=NM.value.replace(/[^가-힣]/g,'').slice(0,5)});NM.addEventListener('input',()=>{if(!comp)NM.value=NM.value.replace(/[^가-힣]/g,'').slice(0,5)});
$('#sid').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,5));$('#pt').addEventListener('change',R);
run(async()=>{const s=await API.load();C=s.C;RQ=s.RQ||[];if(s.PS){PS=s.PS;cur=s.cur;sess=s.sess;nid=s.nid}R();if(cur)toast('진행 중이던 발급을 불러왔습니다')});R();
dev({'참여자 번호 입력(세션명 도착)':()=>{if(cur){sess=rn();R()}else toast('먼저 발급을 눌러주세요')},'재연결 요청 도착':()=>{RQ.push({id:211,sess:rn()});R()},'활성 인원 가득':()=>{fill=AC-act()+fill;R()},'가득 해제':()=>{fill=0;R()},'1부 종료(자동 퇴장)':()=>setP(1,'ended'),'오류':()=>$('#er').classList.add('on')});
</script></body></html>
