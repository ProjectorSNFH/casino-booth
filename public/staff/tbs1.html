<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASINO · 명예의 전당 (tbs1)</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--bg:#07080b;--p:rgba(22,24,32,.86);--ln:rgba(255,255,255,.12);--ink:#f1f3f6;--mut:#9aa1ab;--amb:#f0a83a;--red:#ff6b7a;--grn:#5fe0a0}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px Inter,system-ui,'Noto Sans KR',sans-serif;min-height:100dvh}
#bg{position:fixed;inset:0;z-index:0}.wr{position:relative;z-index:1;min-height:100dvh;padding-top:34px}
button{font:inherit;cursor:pointer;color:inherit}.rp{position:relative;overflow:hidden}.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.26);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.tb{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ln);background:var(--p);backdrop-filter:blur(8px)}.logo{font:17px Monoton,cursive;color:var(--amb)}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--p);font-weight:600}.btn.g{background:var(--amb);color:#111;border-color:var(--amb)}.btn.r{border-color:#6a2c33;color:var(--red);background:none}.btn.w{background:none;border-color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.big{width:100%;padding:18px;font-size:17px}
.in{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--ln);background:rgba(0,0,0,.35);color:#fff;font:14px Inter}.in:focus{outline:0;border-color:var(--amb)}
.cd{background:var(--p);border:1px solid var(--ln);border-radius:16px;backdrop-filter:blur(8px)}.c{padding:20px}.mu{color:var(--mut);font-size:12px}.bn{font:700 44px 'Space Grotesk';color:var(--amb)}.er2{color:var(--red);font-size:12.5px;margin:8px 0;min-height:16px}
.sp{position:relative;width:40px;height:40px;margin:30px auto}.sp i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 32px/1 'Space Grotesk';font-style:normal;opacity:0;animation:su 2s infinite}.sp i:nth-child(odd){color:#e8ebf0}.sp i:nth-child(even){color:#ff4d5e}.sp i:nth-child(2){animation-delay:.5s}.sp i:nth-child(3){animation-delay:1s}.sp i:nth-child(4){animation-delay:1.5s}
@keyframes su{0%{opacity:0;transform:scale(.5) rotate(-20deg)}6%{opacity:1;transform:scale(1) rotate(0)}22%{opacity:1}28%{opacity:0;transform:scale(1.35)}100%{opacity:0}}
#er{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:24px}#er.on{display:flex}#er h1{font-size:20px;margin:10px 0 6px}#er p{color:var(--mut);margin:0 0 20px}
.tt{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:600;font-size:13px;padding:9px 16px;border-radius:20px;z-index:40;display:none}
#dv{position:fixed;top:0;left:0;right:0;z-index:20;background:#000c;display:flex;gap:4px;overflow-x:auto;padding:6px}#dv button{flex:none;font:11px Inter;padding:5px 9px;border-radius:20px;border:1px solid #333;background:#161616;color:#aaa}
.tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--ln)}.tag.a{color:var(--grn);border-color:#2c5a45}.tag.p{color:var(--amb);border-color:#5a4718}.tag.b{color:var(--red);border-color:#6a2c33}.tag.d{color:#7a828a}
.hv .btn:hover{transform:translateY(-1px);filter:brightness(1.18)}.hv tbody tr:hover{background:#ffffff08}.btn{transition:.15s}
body{overflow:hidden}.nz{position:relative;border-radius:24px}.nz::before{content:"";position:absolute;inset:-5px;border-radius:inherit;background:linear-gradient(120deg,#ff2bd6,#2b8cff,#22ffc4);filter:blur(20px);opacity:.5;animation:hue 9s linear infinite}@keyframes hue{to{filter:blur(20px) hue-rotate(360deg)}}
.gl{position:relative;border-radius:inherit;background:rgba(22,24,32,.55);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tv{min-width:1024px;height:100dvh;display:flex;flex-direction:column;padding-top:0}.hd{margin:44px 48px 0}.hd .gl{display:flex;justify-content:space-between;align-items:center;padding:16px 28px}.logo{font-size:30px;color:#fff;text-shadow:0 0 14px #ff2bd6aa,0 0 28px #2b8cff88}.rf{color:var(--mut);font-size:14px}
h1{text-align:center;font:700 34px 'Space Grotesk';margin:22px 0 22px}h1 span{color:var(--amb)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:34px;min-height:170px}.pc{width:230px;text-align:center;padding:24px 20px}.pc.p1{width:280px;padding:30px 20px}.pc .m{font-size:42px}.pc.p1 .m{font-size:56px}.pc .nm{font:600 22px 'Space Grotesk';margin:6px 0}.pc.p1 .nm{font-size:28px}.pc .cv{font:700 32px 'Space Grotesk';color:var(--amb)}.pc.p1 .cv{font-size:42px}.pc .u{font-size:13px;color:var(--mut);margin-left:4px}
.pc .in2.pop{animation:pp .55s cubic-bezier(.2,.9,.3,1.3)}@keyframes pp{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.lw{position:relative;flex:1;max-width:640px;width:100%;margin:26px auto 0;padding:0 40px 24px;overflow:hidden}.lr{position:relative;display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln);font-size:17px;background:rgba(7,8,11,.6)}.lr .rk{width:44px;font-family:'Space Grotesk';color:var(--mut)}.lr .nm{flex:1}.lr .cv{font-family:'Space Grotesk';color:var(--amb)}
.lr.en{opacity:0;transform:translateY(16px) scale(.95)}.lr.ea{opacity:1;transform:none;transition:opacity .45s,transform .5s cubic-bezier(.34,1.56,.64,1)}.lr.ex{opacity:0;transform:translateY(-10px) scale(.92);transition:opacity .4s,transform .4s;pointer-events:none}</style></head><body class=""><canvas id="bg"></canvas><div id="dv"></div><div class="tt" id="tt"></div>
<div id="er"><div><div style="font-size:34px">🌐</div><h1>오류가 발생했습니다</h1><p>연결 지연 또는 연결하는 중에 오류가 발생하였습니다.</p><button class="btn g" onclick="location.reload()">↻ 새로고침</button></div></div>
<div class="wr"><div class="tv"><div class="nz hd"><div class="gl"><span class="logo" style="font-family:Monoton,cursive">CASINO</span><span class="rf">● 다음 갱신까지 <b id="cd">10</b>초</span></div></div><h1>🏆 명예의 <span>전당</span></h1><div class="pod" id="pod"></div><div class="lw" id="lw"></div></div></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
(()=>{const c=$('#bg'),x=c.getContext('2d'),S=22,rs=()=>{c.width=innerWidth;c.height=innerHeight};rs();addEventListener('resize',rs);const f=t=>{const h=c.height,pf=(t/5200)%1.5;x.clearRect(0,0,c.width,h);for(let y=S/2;y<h;y+=S)for(let u=S/2;u<c.width;u+=S){const d=1-y/h+Math.sin(u/70+t/1100)*.025,k=Math.max(0,1-Math.abs(d-pf)*4.5);x.fillStyle=`rgba(255,255,255,${.06+.45*k})`;x.beginPath();x.arc(u,y,1+1.2*k,0,6.3);x.fill()}requestAnimationFrame(f)};requestAnimationFrame(f)})();
addEventListener('pointerdown',e=>{const t=e.target.closest('.rp');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.5,i=document.createElement('i');i.className='rip';i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(i);setTimeout(()=>i.remove(),600)});
const SUIT='<div class="sp"><i>♠︎</i><i>♥︎</i><i>♣︎</i><i>♦︎</i></div>',toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
window.FAIL=false;const lat=()=>new Promise((r,j)=>setTimeout(()=>window.FAIL?j(1):r(),300)),run=async f=>{try{await f()}catch(e){$('#er').classList.add('on')}};
const rn=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'abcdefghijklmnopqrstuvwxyz'[b%26]).join('');
function dev(o){for(const k in o){const b=document.createElement('button');b.textContent=k;b.className='rp';b.onclick=o[k];$('#dv').appendChild(b)}}


const NM=['홍*동','박*영','이*진','김*수','최*원','정*아','오*훈','한*율','서*민','윤*지','임*호','백*은','강*준','문*희'];
let PL=NM.map((n,i)=>({n,ban:false,log:[5,...Array.from({length:4},()=>Math.round((Math.random()-.3)*16))]}));
/* 서버 어댑터: GET /hof (Redis 10초 캐시). 순위값 = TList 누적 잔고의 최대치(정정 반영), 이용 제한 카드 제외, 퇴장자 포함 */
const API={async hof(){await lat();return PL.filter(p=>!p.ban).map(p=>{let b=0,m=-1e9;p.log.forEach(d=>{b+=d;m=Math.max(m,b)});return{n:p.n,v:m}}).sort((a,b)=>b.v-a.v||a.n.localeCompare(b.n))}};
let prev=[],rows=new Map();const pod=$('#pod'),lw=$('#lw'),MD=['🥇','🥈','🥉'];
function render(r){const pl=r.length<4;pod.style.display=pl?'none':'flex';
 if(!pl){const top=r.slice(0,3);pod.innerHTML=[1,0,2].map(i=>{const p=top[i],nw=!prev.includes(p.n);return `<div class="nz"><div class="gl pc ${i===0?'p1':''}"><div class="in2${nw?' pop':''}"><div class="m">${MD[i]}</div><div class="nm">${p.n}</div><div class="cv">${p.v}<span class="u">코인</span></div></div></div></div>`}).join('');prev=top.map(p=>p.n)}else prev=[];
 list(pl?r:r.slice(3),pl)}
function list(items,plain){const ns=new Set(items.map(p=>p.n)),old=[...rows.keys()],rem=old.filter(n=>!ns.has(n)),kept=old.filter(n=>ns.has(n)),fr=new Map(),wr=lw.getBoundingClientRect();kept.forEach(n=>fr.set(n,rows.get(n).getBoundingClientRect().top));
 rem.forEach(n=>{const e=rows.get(n),r=e.getBoundingClientRect();e.style.cssText+=`position:absolute;left:${r.left-wr.left}px;top:${r.top-wr.top}px;width:${r.width}px`;e.classList.add('ex');setTimeout(()=>e.remove(),420);rows.delete(n)});
 items.forEach((p,i)=>{let e=rows.get(p.n);if(!e){e=document.createElement('div');e.className='lr en';rows.set(p.n,e)}e.innerHTML=`<span class="rk">${plain?i+1:i+4}</span><span class="nm">${p.n}</span><span class="cv">${p.v}${plain?' 코인':''}</span>`;lw.appendChild(e)});
 kept.forEach(n=>{const e=rows.get(n),dy=fr.get(n)-e.getBoundingClientRect().top;e.style.transition='none';e.style.transform=dy?`translateY(${dy}px)`:'none';requestAnimationFrame(()=>{e.style.transition='transform .55s cubic-bezier(.34,1.56,.64,1)';e.style.transform='translateY(0)'})});
 items.forEach(p=>{const e=rows.get(p.n);if(e.classList.contains('en'))requestAnimationFrame(()=>requestAnimationFrame(()=>{e.classList.remove('en');e.classList.add('ea')}))})}
const refresh=()=>run(async()=>render(await API.hof()));
/* 목업: 10초마다 임의의 참가자 몇 명의 TList에 변동을 추가 */
function mock(){for(let k=0;k<5;k++){const p=PL[Math.floor(Math.random()*PL.length)];p.log.push(Math.round((Math.random()-.35)*18))}}
let t=10;setInterval(()=>{t--;if(t<=0){t=10;mock();refresh()}$('#cd').textContent=t},1000);refresh();
dev({'지금 갱신':()=>{mock();refresh()},'3명 이하':()=>{PL=PL.slice(0,3);prev=[];refresh()},'1위 이용 제한':()=>{const r=[...PL].filter(p=>!p.ban).map(p=>({p,v:Math.max(...p.log.reduce((a,d)=>[...a,(a[a.length-1]||0)+d],[]))})).sort((a,b)=>b.v-a.v)[0];r.p.ban=true;refresh()},'오류':()=>$('#er').classList.add('on')});
</script></body></html>
