<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASINO · 상품 승인 (shp1)</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--bg:#07080b;--p:rgba(22,24,32,.86);--ln:rgba(255,255,255,.12);--ink:#f1f3f6;--mut:#9aa1ab;--amb:#f0a83a;--red:#ff6b7a;--grn:#5fe0a0}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px Inter,system-ui,'Noto Sans KR',sans-serif;min-height:100dvh}
#bg{position:fixed;inset:0;z-index:0}.wr{position:relative;z-index:1;min-height:100dvh;padding-top:34px}
button{font:inherit;cursor:pointer;color:inherit}.rp{position:relative;overflow:hidden}.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.26);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.tb{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ln);background:var(--p);backdrop-filter:blur(8px)}.logo{font:17px Monoton,cursive;color:var(--amb)}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--p);font-weight:600}.btn.g{background:var(--amb);color:#111;border-color:var(--amb)}.btn.r{border-color:#6a2c33;color:var(--red);background:none}.btn.w{background:none;border-color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.big{width:100%;padding:18px;font-size:17px}
.in{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--ln);background:rgba(0,0,0,.35);color:#fff;font:14px Inter}.in:focus{outline:0;border-color:var(--amb)}
.cd{background:var(--p);border:1px solid var(--ln);border-radius:16px;backdrop-filter:blur(8px)}.c{padding:20px}.mu{color:var(--mut);font-size:12px}.bn{font:700 44px 'Space Grotesk';color:var(--amb)}.er2{color:var(--red);font-size:12.5px;margin:8px 0;min-height:16px}
.sp{position:relative;width:40px;height:40px;margin:30px auto}.sp i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 32px/1 'Space Grotesk';font-style:normal;opacity:0;animation:su 2s infinite}.sp i:nth-child(odd){color:#e8ebf0}.sp i:nth-child(even){color:#ff4d5e}.sp i:nth-child(2){animation-delay:.5s}.sp i:nth-child(3){animation-delay:1s}.sp i:nth-child(4){animation-delay:1.5s}
@keyframes su{0%{opacity:0;transform:scale(.5) rotate(-20deg)}6%{opacity:1;transform:scale(1) rotate(0)}22%{opacity:1}28%{opacity:0;transform:scale(1.35)}100%{opacity:0}}
#er{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:24px}#er.on{display:flex}#er h1{font-size:20px;margin:10px 0 6px}#er p{color:var(--mut);margin:0 0 20px}
.tt{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:600;font-size:13px;padding:9px 16px;border-radius:20px;z-index:40;display:none}
#dv{position:fixed;top:0;left:0;right:0;z-index:20;background:#000c;display:flex;gap:4px;overflow-x:auto;padding:6px}#dv button{flex:none;font:11px Inter;padding:5px 9px;border-radius:20px;border:1px solid #333;background:#161616;color:#aaa}
.tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--ln)}.tag.a{color:var(--grn);border-color:#2c5a45}.tag.p{color:var(--amb);border-color:#5a4718}.tag.b{color:var(--red);border-color:#6a2c33}.tag.d{color:#7a828a}
.hv .btn:hover{transform:translateY(-1px);filter:brightness(1.18)}.hv tbody tr:hover{background:#ffffff08}.btn{transition:.15s}
.lay{display:flex;min-height:calc(100dvh - 90px)}.sd{width:190px;border-right:1px solid var(--ln);padding:18px 12px;background:var(--p)}.sd button{width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:0;background:none;margin-bottom:6px;font-weight:600;color:var(--mut)}.sd button.on{background:rgba(240,168,58,.14);color:var(--amb)}
.mn{flex:1;padding:22px 26px}.gr{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;height:calc(100dvh - 190px)}.tl{border-radius:26px;border:1px solid var(--ln);background:var(--p);padding:24px;display:flex;flex-direction:column;backdrop-filter:blur(8px)}.tl.bg{grid-row:1/3}.tl.sm{align-items:center;justify-content:center;text-align:center}.tl.em{opacity:.35;border-style:dashed}
.tl ul{list-style:none;padding:0;margin:14px 0;flex:1}.tl li{display:flex;justify-content:space-between;padding:11px 2px;border-top:1px solid var(--ln);font-size:17px}.tt2{font:700 22px 'Space Grotesk';color:var(--amb);margin-bottom:12px}.wn{background:#33201d;border:1px solid #6a2c33;color:#f4b3ac;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.rw{display:flex;gap:10px}.rw>*{flex:1}.pr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;margin-bottom:10px}.sg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.sg button{border:0;background:none;padding:9px 18px;font-weight:600;color:var(--mut)}.sg .on.s{background:#1c3a2c;color:var(--grn)}.sg .on.o{background:#3a1c20;color:var(--red)}</style></head><body class="hv"><canvas id="bg"></canvas><div id="dv"></div><div class="tt" id="tt"></div>
<div id="er"><div><div style="font-size:34px">🌐</div><h1>오류가 발생했습니다</h1><p>연결 지연 또는 연결하는 중에 오류가 발생하였습니다.</p><button class="btn g" onclick="location.reload()">↻ 새로고침</button></div></div>
<div class="wr"><div class="tb"><span class="logo">CASINO</span><b>상품 승인 · shp1</b><span class="mu" id="cnt"></span></div><div class="lay"><div class="sd"><button id="t1" class="on rp" onclick="T('o')">주문 확인</button><button id="t2" class="rp" onclick="T('s')">재고 확인</button></div><div class="mn" id="c"></div></div></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
(()=>{const c=$('#bg'),x=c.getContext('2d'),S=22,rs=()=>{c.width=innerWidth;c.height=innerHeight};rs();addEventListener('resize',rs);const f=t=>{const h=c.height,pf=(t/5200)%1.5;x.clearRect(0,0,c.width,h);for(let y=S/2;y<h;y+=S)for(let u=S/2;u<c.width;u+=S){const d=1-y/h+Math.sin(u/70+t/1100)*.025,k=Math.max(0,1-Math.abs(d-pf)*4.5);x.fillStyle=`rgba(255,255,255,${.06+.45*k})`;x.beginPath();x.arc(u,y,1+1.2*k,0,6.3);x.fill()}requestAnimationFrame(f)};requestAnimationFrame(f)})();
addEventListener('pointerdown',e=>{const t=e.target.closest('.rp');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.5,i=document.createElement('i');i.className='rip';i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(i);setTimeout(()=>i.remove(),600)});
const SUIT='<div class="sp"><i>♠︎</i><i>♥︎</i><i>♣︎</i><i>♦︎</i></div>',toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
window.FAIL=false;const lat=()=>new Promise((r,j)=>setTimeout(()=>window.FAIL?j(1):r(),300)),run=async f=>{try{await f()}catch(e){$('#er').classList.add('on')}};
const rn=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'abcdefghijklmnopqrstuvwxyz'[b%26]).join('');
function dev(o){for(const k in o){const b=document.createElement('button');b.textContent=k;b.className='rp';b.onclick=o[k];$('#dv').appendChild(b)}}

const PR=[['마이쥬',3],['마카로니',7],['초코파이',9],['쌀과자',5],['젤리스트로우',7]],BAL={211:37,301:12,322:9,145:60,188:25,209:3};let ST={},O=null,tab='o';
const SEED={st:{},o:[{id:211,items:{'마이쥬':1,'초코파이':1},total:12},{id:301,items:{'마카로니':1},total:7},{id:322,items:{'쌀과자':1},total:5},{id:145,items:{'마이쥬':2},total:6},{id:188,items:{'젤리스트로우':1},total:7},{id:209,items:{'마이쥬':1},total:3}]};
/* 서버 어댑터: 새 주문은 Realtime 구독, 승인은 서버가 잔고/품절/진행중 매치를 재검증하고 PURCHASE+EXIT를 한 트랜잭션으로 기록 */
const API={async load(){await lat();return JSON.parse(localStorage.getItem('sh1')||'null')||SEED},save(){localStorage.setItem('sh1',JSON.stringify({st:ST,o:O}))},async stock(){await lat()},async approve(o){await lat();if((BAL[o.id]||0)<o.total)throw'bal'},async reject(){await lat()}};
function T(t){tab=t;$('#t1').classList.toggle('on',t==='o');$('#t2').classList.toggle('on',t==='s');R()}
function R(){const c=$('#c');if(!O){c.innerHTML=SUIT;return}$('#cnt').textContent='총 주문 '+O.length;API.save();
 if(tab==='s'){c.innerHTML=`<h2 style="margin-top:0">재고 확인</h2>`+PR.map(p=>{const so=ST[p[0]]==='sold';return `<div class="cd pr"><div><b>${p[0]}</b> <span class="mu">${p[1]}C</span></div><div class="sg"><button class="s rp ${so?'':'on'}" onclick="stk('${p[0]}','on')">판매</button><button class="o rp ${so?'on':''}" onclick="stk('${p[0]}','sold')">품절</button></div></div>`}).join('');return}
 if(!O.length){c.innerHTML=`<div class="cd c" style="text-align:center;margin-top:60px"><div style="font-size:34px">🧾</div><h2>대기 중인 주문이 없습니다</h2></div>`;return}
 const f=O[0],bad=Object.keys(f.items).filter(k=>ST[k]==='sold');
 const big=`<div class="tl bg"><div class="mu">첫 번째 주문</div><div class="bn">No.${f.id}</div><ul>${Object.entries(f.items).map(([k,v])=>`<li><span>${k}</span><b>×${v}</b></li>`).join('')}</ul><div class="tt2">합계 ${f.total}C</div>${bad.length?`<div class="wn">품절 상품 포함: ${bad.join(', ')} — 재고 탭에서 판매로 바꾸거나 거절하세요.</div>`:''}<div class="rw"><button class="btn r big rp" onclick="rej()">거절</button><button class="btn g big rp" ${bad.length?'disabled':''} onclick="apv()">승인</button></div></div>`;
 const sm=[1,2,3,4].map(i=>O[i]?`<div class="tl sm"><div class="mu">${i+1}번째 대기</div><div class="bn" style="font-size:36px">No.${O[i].id}</div></div>`:`<div class="tl sm em"><div class="mu">비어있음</div></div>`).join('');
 c.innerHTML=`<div class="gr">${big}${sm}</div>`}
const stk=(n,v)=>run(async()=>{const old=ST[n];ST[n]=v==='sold'?'sold':'';R();try{await API.stock(n,v)}catch(e){ST[n]=old;R();toast('재고 변경에 실패해 되돌렸습니다');throw e}});
const apv=()=>run(async()=>{const o=O[0];try{await API.approve(o)}catch(e){if(e==='bal'){toast('잔고가 부족해 승인할 수 없습니다 (거절해주세요)');return}throw e}O.shift();R();toast('승인 완료 · 퇴장 처리됨')});
const rej=()=>run(async()=>{await API.reject();O.shift();R();toast('거절했습니다 · 참여자는 홈으로 돌아갑니다')});
run(async()=>{const s=await API.load();ST=s.st;O=s.o;R()});R();
dev({'참여자 취소(3번째)':()=>{if(O&&O[2]){O.splice(2,1);R();toast('3번째 주문이 취소되어 뒤 번호가 당겨졌습니다')}},'초코파이 품절':()=>{ST['초코파이']='sold';R()},'새 주문':()=>{O.push({id:[322,145][O.length%2],items:{'마카로니':2},total:14});R()},'재고 실패 시연':()=>{window.FAIL=!window.FAIL;toast('재고 변경 실패 모드 '+(window.FAIL?'ON':'OFF'))},'오류':()=>$('#er').classList.add('on')});
</script></body></html>
